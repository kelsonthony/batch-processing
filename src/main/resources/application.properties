
server.port=9191
spring.batch.initialize-schema=ALWAYS

#disabled job run at startup
spring.batch.job.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

customer.excel.filepath=files/customers.xlsx

external.api.url=http://localhost:8085


resilience4j.circuitbreaker.instances.externalApiCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.externalApiCircuitBreaker.ringBufferSizeInHalfOpenState=10
resilience4j.circuitbreaker.instances.externalApiCircuitBreaker.ringBufferSizeInClosedState=50
resilience4j.circuitbreaker.instances.externalApiCircuitBreaker.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.externalApiCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.externalApiCircuitBreaker.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.externalApiCircuitBreaker.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.externalApiCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.externalApiCircuitBreaker.slidingWindowSize=10


# Configurações do Circuit Breaker padrão
spring.cloud.circuitbreaker.resilience4j.configs.default.circuit-breaker.sliding-window-size=10
spring.cloud.circuitbreaker.resilience4j.configs.default.circuit-breaker.failure-rate-threshold=50
spring.cloud.circuitbreaker.resilience4j.configs.default.circuit-breaker.wait-duration-in-open-state=10000
spring.cloud.circuitbreaker.resilience4j.configs.default.circuit-breaker.permitted-number-of-calls-in-half-open-state=5




